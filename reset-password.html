<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Redefinir senha — Barbearia P.B.</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<main>
  <img class="logo" src="logo.jpeg" alt="Barbearia P.B.">

  <section>
    <h2>Definir nova senha</h2>
    <p>Digite sua nova senha duas vezes.</p>

    <label for="pw">Nova senha</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="8">

    <label for="pw2">Confirmar nova senha</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="8">

    <button class="main" id="salvar" type="button">
      Salvar nova senha
    </button>

    <div id="msg" class="msg" role="status" aria-live="polite"></div>
  </section>

  <footer>
    <a href="admin.html">Voltar ao painel administrativo</a>
  </footer>
</main>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
let recoveryReady = false;

function mensagem(texto, sucesso = false) {
  $("msg").textContent = texto;
  $("msg").className = "msg " + (sucesso ? "ok" : "bad");
}

async function verificarSessao() {
  const { data, error } = await db.auth.getSession();

  if (error) {
    mensagem("Erro ao verificar o link. Solicite outro e-mail de recuperação.");
    return;
  }

  recoveryReady = !!data.session;

  if (recoveryReady) {
    mensagem("Link validado! Você já pode definir sua senha.", true);
  } else {
    mensagem("Abra esta página pelo link de recuperação enviado pelo Supabase. Se o link expirou, solicite outro.");
  }
}

db.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY" || session) {
    recoveryReady = !!session;

    if (recoveryReady) {
      mensagem("Link validado! Você já pode definir sua senha.", true);
    }
  }
});

$("salvar").addEventListener("click", async () => {
  const senha = $("pw").value;
  const confirmacao = $("pw2").value;

  if (!recoveryReady) {
    await verificarSessao();
    if (!recoveryReady) return;
  }

  if (senha.length < 8) {
    mensagem("A senha precisa ter pelo menos 8 caracteres.");
    return;
  }

  if (senha !== confirmacao) {
    mensagem("As senhas não coincidem.");
    return;
  }

  $("salvar").disabled = true;
  mensagem("Salvando nova senha...");

  const { error } = await db.auth.updateUser({
    password: senha
  });

  $("salvar").disabled = false;

  if (error) {
    mensagem("Não foi possível salvar: " + error.message);
    return;
  }

  $("pw").value = "";
  $("pw2").value = "";

  mensagem(
    "Senha alterada com sucesso! Agora entre no painel com seu e-mail e a nova senha.",
    true
  );
});

verificarSessao();
</script>
</body>
</html>
