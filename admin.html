<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barbearia P.B — Área do profissional</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<main>
<img class="logo" src="logo.jpeg" alt="Barbearia P.B">

<section id="login">
  <h2>Área do profissional</h2>
  <label for="pw">Senha do profissional</label>
  <input id="pw" type="password"
         autocomplete="current-password"
         placeholder="Digite sua senha">
  <button class="main" id="entrar">Entrar</button>
  <div id="lmsg" class="msg bad" role="alert"></div>
</section>

<section id="painel" hidden>
  <div class="row">
    <h2 style="margin:0">Agenda</h2>
    <button class="sm" id="sair">Sair</button>
  </div>

  <label for="zap">WhatsApp que recebe os agendamentos</label>
  <div class="row" style="border:0;padding:0">
    <input id="zap" type="tel" placeholder="(19) 90000-0000">
    <button class="sm" id="salvaZap">Salvar</button>
  </div>
  <div id="zmsg" class="msg ok"></div>

  <label for="dia">Dia</label>
  <input type="date" id="dia">
  <div id="total" class="msg"></div>
  <div id="lista"></div>
</section>

<footer><a href="index.html">Voltar ao site do cliente</a></footer>
</main>

<script src="config.js"></script>
<script>
"use strict";

const $ = id => document.getElementById(id);
const CONTA_INTERNA = "barbeariapb11@gmail.com";

const hojeLocal = () => {
  const agora = new Date();
  agora.setMinutes(agora.getMinutes() - agora.getTimezoneOffset());
  return agora.toISOString().slice(0, 10);
};

$("dia").value = hojeLocal();

const esc = valor => String(valor ?? "").replace(/[&<>"']/g, c => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[c]));

function mostrarErroLogin(mensagem) {
  $("lmsg").textContent = mensagem;
}

async function checar() {
  const { data, error } = await db.auth.getSession();

  if (error) {
    mostrarErroLogin("Erro ao verificar o acesso. Tente novamente.");
    return;
  }

  const session = data.session;
  $("login").hidden = !!session;
  $("painel").hidden = !session;

  if (session) {
    await Promise.all([listar(), carregaZap()]);
  }
}

$("entrar").onclick = async () => {
  const senha = $("pw").value;

  if (!senha) {
    mostrarErroLogin("Digite sua senha.");
    return;
  }

  $("entrar").disabled = true;
  mostrarErroLogin("Verificando acesso...");

  try {
    const { error } = await db.auth.signInWithPassword({
      email: CONTA_INTERNA,
      password: senha
    });

    if (error) {
      mostrarErroLogin(
        "Senha incorreta ou acesso indisponível. Verifique a configuração."
      );
      return;
    }

    $("pw").value = "";
    $("lmsg").textContent = "";
    await checar();
  } catch (erro) {
    mostrarErroLogin("Não foi possível conectar. Verifique sua internet.");
  } finally {
    $("entrar").disabled = false;
  }
};

$("pw").addEventListener("keydown", evento => {
  if (evento.key === "Enter") $("entrar").click();
});

$("sair").onclick = async () => {
  const { error } = await db.auth.signOut();

  if (error) {
    alert("Não foi possível sair. Tente novamente.");
    return;
  }

  $("login").hidden = false;
  $("painel").hidden = true;
};

$("dia").onchange = () => listar();

async function carregaZap() {
  const { data, error } = await db
    .from("configuracoes")
    .select("whatsapp")
    .eq("id", 1)
    .maybeSingle();

  if (error) {
    $("zmsg").className = "msg bad";
    $("zmsg").textContent = "Não foi possível carregar o WhatsApp.";
    return;
  }

  $("zap").value = data?.whatsapp || "";
}

$("salvaZap").onclick = async () => {
  $("salvaZap").disabled = true;

  try {
    const { error } = await db.from("configuracoes").upsert({
      id: 1,
      whatsapp: $("zap").value.trim()
    });

    $("zmsg").className = "msg " + (error ? "bad" : "ok");
    $("zmsg").textContent = error
      ? "Não foi possível salvar o WhatsApp."
      : "WhatsApp salvo!";
  } catch (erro) {
    $("zmsg").className = "msg bad";
    $("zmsg").textContent = "Erro de conexão ao salvar.";
  } finally {
    $("salvaZap").disabled = false;
  }
};

async function listar() {
  $("lista").textContent = "Carregando agendamentos...";
  const dataSelecionada = $("dia").value;

  try {
    const { data, error } = await db
      .from("agendamentos")
      .select("*")
      .eq("data", dataSelecionada)
      .order("hora");

    if (error) {
      $("lista").textContent =
        "Erro ao carregar a agenda. Verifique o acesso ao banco.";
      return;
    }

    const agendamentos = data || [];
    const ativos = agendamentos.filter(
      a => a.status !== "cancelado"
    );

    $("total").textContent =
      `${ativos.length} cliente(s) · ` +
      brl(ativos.reduce((s, a) => s + Number(a.preco || 0), 0)) +
      " previstos";

    $("lista").innerHTML = agendamentos.length
      ? agendamentos.map(a => `
        <div class="row ${esc(a.status)}">
          <div>
            <b>${esc(String(a.hora || "").slice(0, 5))}</b>
            ${esc(a.nome)}
            <small>
              ${esc(a.servico)} · ${brl(Number(a.preco || 0))} ·
              <a style="color:inherit"
                 href="https://wa.me/55${String(a.telefone || "").replace(/\D/g, "")}">
                ${esc(a.telefone)}
              </a>
            </small>
          </div>
          <div>
            ${a.status === "agendado"
              ? `<button class="sm"
                   onclick="mudar('${esc(a.id)}','concluido')">Concluir</button>
                 <button class="sm"
                   onclick="mudar('${esc(a.id)}','cancelado')">Cancelar</button>`
              : esc(a.status)}
          </div>
        </div>
      `).join("")
      : "<p>Nenhum agendamento neste dia.</p>";
  } catch (erro) {
    $("lista").textContent = "Erro de conexão ao carregar a agenda.";
  }
}

async function mudar(id, status) {
  if (!["concluido", "cancelado"].includes(status)) return;

  const { error } = await db
    .from("agendamentos")
    .update({ status })
    .eq("id", id);

  if (error) {
    alert("Não foi possível atualizar o agendamento.");
    return;
  }

  await listar();
}

checar();
</script>
</body>
</html>
