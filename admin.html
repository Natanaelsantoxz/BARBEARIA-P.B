<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barbearia P.B — Área do profissional</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
[hidden]{display:none!important}
input[type=checkbox]{width:auto}
select{width:100%;padding:.7rem;background:#000;color:var(--text);border:1px solid var(--line);border-radius:10px;font:inherit}
.fr select{flex:1;min-width:90px;width:auto}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:.8rem 0}
.tabs .sm[aria-pressed=true]{background:var(--silver);color:#000}
.fr{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;padding:.6rem 0;border-bottom:1px dashed var(--line)}
.fr input:not([type=checkbox]){flex:1;min-width:90px}
.fr label{margin:0;display:flex;gap:.3rem;align-items:center}
</style>
<link rel="manifest" href="manifest-admin.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
<div id="splash" aria-hidden="true"><img src="icon-512.png" alt=""><div class="bar"></div></div>
<script>try{if(sessionStorage.getItem("pbs")){document.getElementById("splash").remove()}else{sessionStorage.setItem("pbs","1");document.documentElement.classList.add("sp")}}catch(e){document.getElementById("splash").remove()}</script>
<main>
<img class="logo" src="logo.jpeg" alt="Barbearia P.B">

<section id="login">
  <h2>Área do profissional</h2>
  <label for="pw">Senha do profissional</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Digite sua senha">
  <button class="main" id="entrar" type="button">Entrar</button>
  <div id="lmsg" class="msg bad" role="alert"></div>
  <footer><a href="reset-password.html">Esqueci minha senha</a></footer>
</section>

<section id="painel" hidden>
  <div class="row"><h2 style="margin:0">Painel</h2><button class="sm" id="sair" type="button">Sair</button></div>
  <div class="tabs">
    <button class="sm" data-tab="t1" aria-pressed="true">Agenda</button>
    <button class="sm" data-tab="t2" aria-pressed="false">Serviços</button>
    <button class="sm" data-tab="t3" aria-pressed="false">Horários</button>
    <button class="sm" data-tab="t4" aria-pressed="false">Bloqueios</button>
    <button class="sm" data-tab="t5" aria-pressed="false">WhatsApp</button>
  </div>

  <div id="t1" class="tab">
    <label for="dia">Dia</label><div class="fr" style="border:0;padding:0"><button class="sm" id="dprev" type="button">‹</button><select id="dia"></select><button class="sm" id="dnext" type="button">›</button><button class="sm" id="dhoje" type="button">Hoje</button></div>
    <div id="total" class="msg"></div><div id="lista"></div>
  </div>

  <div id="t2" class="tab" hidden>
    <p>Nome · Preço (R$) · Minutos</p>
    <div id="svl"></div>
    <h3 style="margin-top:1rem">Novo serviço</h3>
    <div class="fr">
      <input id="sn" placeholder="Nome">
      <input id="sp" type="number" step="0.01" placeholder="Preço" style="max-width:100px">
      <input id="sd" type="number" placeholder="Minutos" style="max-width:100px">
      <button class="sm" id="sadd" type="button">Adicionar</button>
    </div>
    <div id="smsg" class="msg"></div>
  </div>

  <div id="t3" class="tab" hidden>
    <p>Marque os dias em que você abre e o horário de cada um.</p>
    <div id="sem"></div>
    <label for="passo">Intervalo entre horários (minutos)</label>
    <input id="passo" type="number" min="5" step="5">
    <button class="main" id="ssem" type="button">Salvar horários</button>
    <div id="hmsg" class="msg"></div>
  </div>

  <div id="t4" class="tab" hidden>
    <p>Bloqueie um dia inteiro (folga, feriado) ou só um intervalo (almoço, compromisso).</p>
    <label for="bd">Dia</label><select id="bd"></select>
    <label style="display:flex;gap:.4rem;align-items:center"><input type="checkbox" id="bt"> Dia inteiro</label>
    <div id="bh" class="fr"><label>Das <select id="bi"></select></label><label>às <select id="bf"></select></label></div>
    <label for="bm">Motivo (opcional)</label><input id="bm">
    <button class="main" id="badd" type="button">Bloquear</button>
    <div id="bmsg" class="msg"></div>
    <div id="bl"></div>
  </div>

  <div id="t5" class="tab" hidden>
    <label for="zap">WhatsApp que recebe os agendamentos</label>
    <div class="row" style="border:0;padding:0">
      <input id="zap" type="tel" placeholder="(19) 90000-0000">
      <button class="sm" id="salvaZap" type="button">Salvar</button>
    </div>
    <div id="zmsg" class="msg"></div>
  </div>
</section>

<footer><a href="index.html">Voltar ao site do cliente</a></footer>
</main>

<script src="config.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const EMAIL = "barbeariapb11@gmail.com";
const DIAS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const msgErr = e => (e && e.message) ? e.message : String(e);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hojeLocal = () => { const a = new Date(); a.setMinutes(a.getMinutes() - a.getTimezoneOffset()); return a.toISOString().slice(0,10); };
function aviso(id, texto, ok) { $(id).className = "msg " + (ok ? "ok" : "bad"); $(id).textContent = texto; }

const isoDia = n => { const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate() + n); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const rotulo = v => { const p = v.split("-"); return ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][new Date(p[0], p[1]-1, p[2]).getDay()] + " " + p[2] + "/" + p[1] + "/" + p[0]; };
const dias = (de, ate) => { let h = ""; for (let n = de; n <= ate; n++) { const v = isoDia(n); h += `<option value="${v}">${rotulo(v)}${n === 0 ? " (hoje)" : ""}</option>`; } return h; };
const hopts = (sel, ini = 300, fim = 1425, p = 15) => {
  const s = String(sel || "").slice(0,5), L = [];
  for (let m = ini; m <= fim; m += p) L.push(String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0"));
  if (s && !L.includes(s)) { L.push(s); L.sort(); }
  return L.map(t => `<option ${t === s ? "selected" : ""}>${t}</option>`).join("");
};
$("dia").innerHTML = dias(-14, 60); $("dia").value = isoDia(0);
$("bd").innerHTML = dias(0, 120);
$("bi").innerHTML = hopts("12:00"); $("bf").innerHTML = hopts("13:00");
$("dprev").onclick = () => { if ($("dia").selectedIndex > 0) { $("dia").selectedIndex--; listar(); } };
$("dnext").onclick = () => { if ($("dia").selectedIndex < $("dia").options.length - 1) { $("dia").selectedIndex++; listar(); } };
$("dhoje").onclick = () => { $("dia").value = isoDia(0); listar(); };

/* ---------- Login ---------- */
function abrirPainel() {
  $("login").hidden = true; $("painel").hidden = false;
  $("pw").value = ""; $("lmsg").textContent = "";
  listar(); carregaZap(); carregaSvc(); carregaSem(); carregaBloq();
}
$("entrar").onclick = async () => {
  const senha = $("pw").value;
  if (!senha) { $("lmsg").textContent = "Digite a senha."; return; }
  $("entrar").disabled = true; $("lmsg").textContent = "Entrando...";
  try {
    const { error } = await db.auth.signInWithPassword({ email: EMAIL, password: senha });
    if (error) {
      $("lmsg").textContent = error.message.toLowerCase().includes("invalid") ? "Senha incorreta." : "Não foi possível entrar: " + error.message;
      $("pw").select(); return;
    }
    abrirPainel();
  } catch (e) { $("lmsg").textContent = "Erro de conexão: " + msgErr(e); }
  finally { $("entrar").disabled = false; }
};
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("entrar").click(); });
$("sair").onclick = async () => { await db.auth.signOut(); $("login").hidden = false; $("painel").hidden = true; };
db.auth.getSession().then(({ data }) => { if (data && data.session) abrirPainel(); });

/* ---------- Abas ---------- */
document.querySelector(".tabs").onclick = e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  document.querySelectorAll(".tabs .sm").forEach(x => x.setAttribute("aria-pressed", x === b));
  document.querySelectorAll(".tab").forEach(t => t.hidden = t.id !== b.dataset.tab);
};

/* ---------- Agenda ---------- */
$("dia").onchange = () => listar();
async function listar() {
  $("lista").textContent = "Carregando agendamentos...";
  try {
    const { data, error } = await db.from("agendamentos").select("*").eq("data", $("dia").value).order("hora");
    if (error) { $("lista").textContent = "Erro ao carregar a agenda: " + error.message; return; }
    const ag = data || [], ativos = ag.filter(a => a.status !== "cancelado");
    const fat = ativos.reduce((s, a) => s + Number(a.preco || 0), 0);
    $("total").textContent = `${ativos.length} cliente(s) · ${brl(fat)} previstos`;
    $("lista").innerHTML = ag.length ? ag.map(a => `
      <div class="row ${esc(a.status)}">
        <div><b>${esc(String(a.hora || "").slice(0,5))}</b> ${esc(a.nome)}
          <small>${esc(a.servico)} · ${brl(Number(a.preco || 0))} ·
          <a style="color:inherit" href="https://wa.me/55${String(a.telefone || "").replace(/\D/g,"")}" target="_blank" rel="noopener noreferrer">${esc(a.telefone)}</a></small></div>
        <div>${a.status === "agendado"
          ? `<button class="sm" onclick="mudar('${esc(a.id)}','concluido')">Concluir</button> <button class="sm" onclick="mudar('${esc(a.id)}','cancelado')">Cancelar</button>`
          : esc(a.status)}</div>
      </div>`).join("") : "<p>Nenhum agendamento neste dia.</p>";
  } catch (e) { $("lista").textContent = "Erro de conexão: " + msgErr(e); }
}
async function mudar(id, status) {
  const { error } = await db.from("agendamentos").update({ status }).eq("id", id);
  if (error) { alert("Não foi possível atualizar: " + error.message); return; }
  listar();
}

/* ---------- Serviços ---------- */
async function carregaSvc() {
  const { data, error } = await db.from("servicos").select("*").order("ordem").order("nome");
  if (error) { aviso("smsg", "Erro ao carregar serviços: " + error.message); return; }
  $("svl").innerHTML = data.map(s => `
    <div class="fr" data-id="${esc(s.id)}" data-ordem="${s.ordem}">
      <input class="n" value="${esc(s.nome)}">
      <input class="p" type="number" step="0.01" value="${s.preco}" style="max-width:90px">
      <input class="d" type="number" value="${s.dur}" style="max-width:80px">
      <label><input class="a" type="checkbox" ${s.ativo ? "checked" : ""}> Ativo</label>
      <button class="sm" data-act="s">Salvar</button>
      <button class="sm" data-act="x">Excluir</button>
    </div>`).join("") || "<p>Nenhum serviço.</p>";
}
$("svl").onclick = async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const r = b.closest("[data-id]"), id = r.dataset.id;
  if (b.dataset.act === "x") {
    if (!confirm("Excluir este serviço?")) return;
    const { error } = await db.from("servicos").delete().eq("id", id);
    aviso("smsg", error ? "Erro: " + error.message : "Serviço excluído.", !error);
  } else {
    const nome = r.querySelector(".n").value.trim(), preco = Number(r.querySelector(".p").value), dur = parseInt(r.querySelector(".d").value, 10);
    if (!nome || !(preco >= 0) || !(dur > 0)) { aviso("smsg", "Preencha nome, preço e minutos."); return; }
    const { error } = await db.from("servicos").update({ nome, preco, dur, ativo: r.querySelector(".a").checked }).eq("id", id);
    aviso("smsg", error ? "Erro: " + error.message : "Serviço salvo!", !error);
  }
  carregaSvc();
};
$("sadd").onclick = async () => {
  const nome = $("sn").value.trim(), preco = Number($("sp").value), dur = parseInt($("sd").value, 10);
  if (!nome || !(preco >= 0) || !$("sp").value || !(dur > 0)) { aviso("smsg", "Preencha nome, preço e minutos."); return; }
  const { error } = await db.from("servicos").insert({ nome, preco, dur, ordem: 99 });
  if (error) { aviso("smsg", "Erro: " + error.message); return; }
  $("sn").value = $("sp").value = $("sd").value = "";
  aviso("smsg", "Serviço adicionado!", true); carregaSvc();
};

/* ---------- Horários da semana ---------- */
async function carregaSem() {
  const [w, c] = await Promise.all([
    db.from("horarios_semana").select("*"),
    db.from("configuracoes").select("passo").eq("id", 1).maybeSingle()]);
  if (w.error) { aviso("hmsg", "Erro: " + w.error.message); return; }
  const m = {}; (w.data || []).forEach(r => m[r.dia] = r);
  $("sem").innerHTML = DIAS.map((n, i) => {
    const r = m[i] || { aberto: i !== 0, abre: "09:00", fecha: "19:00" };
    return `<div class="fr" data-dia="${i}">
      <label style="min-width:100px"><input class="o" type="checkbox" ${r.aberto ? "checked" : ""}> ${n}</label>
      <select class="ab">${hopts(r.abre)}</select>
      <select class="fe">${hopts(r.fecha)}</select></div>`;
  }).join("");
  $("passo").value = (c.data && c.data.passo) || 30;
}
$("ssem").onclick = async () => {
  const linhas = [...document.querySelectorAll("#sem [data-dia]")].map(r => ({
    dia: +r.dataset.dia, aberto: r.querySelector(".o").checked,
    abre: r.querySelector(".ab").value, fecha: r.querySelector(".fe").value }));
  if (linhas.some(l => l.aberto && (!l.abre || !l.fecha || l.abre >= l.fecha))) { aviso("hmsg", "Confira: a abertura deve ser antes do fechamento."); return; }
  const passo = parseInt($("passo").value, 10);
  if (!(passo >= 5)) { aviso("hmsg", "Intervalo inválido."); return; }
  const a = await db.from("horarios_semana").upsert(linhas.map(l => ({ ...l, abre: l.abre || "09:00", fecha: l.fecha || "19:00" })));
  const b = await db.from("configuracoes").upsert({ id: 1, passo });
  const erro = a.error || b.error;
  aviso("hmsg", erro ? "Erro: " + erro.message : "Horários salvos!", !erro);
};

/* ---------- Bloqueios ---------- */
$("bt").onchange = () => { $("bh").hidden = $("bt").checked; };
async function carregaBloq() {
  const { data, error } = await db.from("bloqueios").select("*").gte("data", hojeLocal()).order("data").order("inicio");
  if (error) { aviso("bmsg", "Erro: " + error.message); return; }
  $("bl").innerHTML = (data || []).map(b => `
    <div class="row"><div><b>${b.data.split("-").reverse().join("/")}</b>
      ${b.inicio ? String(b.inicio).slice(0,5) + " às " + String(b.fim).slice(0,5) : "Dia inteiro"}
      <small>${esc(b.motivo)}</small></div>
      <button class="sm" data-del="${esc(b.id)}">Remover</button></div>`).join("") || "<p>Nenhum bloqueio.</p>";
}
$("bl").onclick = async e => {
  const b = e.target.closest("[data-del]"); if (!b) return;
  const { error } = await db.from("bloqueios").delete().eq("id", b.dataset.del);
  if (error) aviso("bmsg", "Erro: " + error.message); else carregaBloq();
};
$("badd").onclick = async () => {
  const inteiro = $("bt").checked, data = $("bd").value;
  if (!data) { aviso("bmsg", "Escolha o dia."); return; }
  if (!inteiro && (!$("bi").value || !$("bf").value || $("bi").value >= $("bf").value)) { aviso("bmsg", "Informe início e fim (início antes do fim)."); return; }
  const { error } = await db.from("bloqueios").insert({
    data, inicio: inteiro ? null : $("bi").value, fim: inteiro ? null : $("bf").value, motivo: $("bm").value.trim() });
  if (error) { aviso("bmsg", "Erro: " + error.message); return; }
  $("bm").value = ""; aviso("bmsg", "Bloqueio salvo!", true); carregaBloq();
};

/* ---------- WhatsApp ---------- */
async function carregaZap() {
  const { data, error } = await db.from("configuracoes").select("whatsapp").eq("id", 1).maybeSingle();
  if (error) { aviso("zmsg", "Não foi possível carregar o WhatsApp: " + error.message); return; }
  $("zap").value = (data && data.whatsapp) || "";
}
$("salvaZap").onclick = async () => {
  $("salvaZap").disabled = true;
  try {
    const { error } = await db.from("configuracoes").upsert({ id: 1, whatsapp: $("zap").value.trim() });
    aviso("zmsg", error ? "Não foi possível salvar: " + error.message : "WhatsApp salvo!", !error);
  } catch (e) { aviso("zmsg", "Erro de conexão: " + msgErr(e)); }
  finally { $("salvaZap").disabled = false; }
};
</script>
</body>
</html>
