<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barbearia P.B — Agende seu horário</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
select{width:100%;padding:.8rem;background:#000;color:#f2f2f2;border:1px solid #3a3a3d;border-radius:10px;font:inherit;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#cfcfd4 50%),linear-gradient(135deg,#cfcfd4 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat}
select:focus-visible{outline:2px solid #cfcfd4;outline-offset:2px}
</style>
</head><body>
<main>
<img class="logo" src="logo.jpeg" alt="Barbearia P.B">
<section><h2>1. Escolha um ou mais serviços</h2><div id="svcs">Carregando...</div></section>
<section id="secprof" hidden><h2>2. Escolha o profissional</h2><div id="profs" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem"></div></section>
<section><h2>3. Escolha o dia e o horário</h2>
<label for="dia">Dia</label><select id="dia"></select>
<label style="margin-top:1.4rem">Horário</label>
<div id="slots" class="slots"></div><div id="info" class="msg"></div></section>
<section><h2>4. Seus dados</h2>
<div id="resumo" class="resumo" hidden></div>
<label for="nome">Nome</label><input id="nome" autocomplete="name">
<label for="tel">WhatsApp</label><input id="tel" type="tel" autocomplete="tel" placeholder="(19) 90000-0000">
<div style="margin-top:1rem;padding:.8rem 1rem;border:1px dashed #cfcfd4;border-radius:10px;color:#cfcfd4;font-size:.92rem;line-height:1.4">⏱ <b>Atenção:</b> a tolerância de atraso é de <b>5 minutos</b>. Após esse tempo, o horário poderá ser cancelado.</div>
<button class="main" id="ok" disabled>Confirmar e enviar no WhatsApp</button><div id="msg" class="msg" role="status"></div></section>
<footer>Qualidade e Tradição · <a href="admin.html">Área do profissional</a></footer>
</main>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
let svcs=[],semana={},passo=30,svc=null,hora=null,ocupados=[],bloq=[],zap="",profs=[],prof=null;
const sel=new Set();
const hoje=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const DS=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
function aberto(d){const w=semana[d.getDay()];return w?w.aberto:!CONFIG.DIAS_FECHADOS.includes(d.getDay());}
function drawProfs(){$("secprof").hidden=profs.length<2;
  $("profs").innerHTML=profs.map((p,i)=>`<button class="svc" aria-pressed="${!!prof&&prof.id===p.id}" data-p="${i}"><span class="n">${p.nome.replace(/</g,"&lt;")}</span></button>`).join("");}
$("profs").onclick=e=>{const b=e.target.closest("[data-p]");if(!b)return;prof=profs[+b.dataset.p];hora=null;drawProfs();carregar();};
function drawDias(){const cur=$("dia").value;let h="",first="";
  for(let i=0;i<30;i++){const d=new Date(hoje+"T12:00");d.setDate(d.getDate()+i);
    const v=iso(d),p=v.split("-"),ok=aberto(d);if(ok&&!first)first=v;
    h+=`<option value="${v}" ${ok?"":"disabled"}>${i==0?"Hoje · ":i==1?"Amanhã · ":""}${DS[d.getDay()]} ${p[2]}/${p[1]}${ok?"":" (fechado)"}</option>`;}
  $("dia").innerHTML=h;
  const manter=[...$("dia").options].some(o=>o.value===cur&&!o.disabled);
  $("dia").value=manter?cur:first;}

async function base(){
  const [c,s,w,pr]=await Promise.all([
    db.from("configuracoes").select("whatsapp,passo").eq("id",1).maybeSingle(),
    db.from("servicos").select("*").eq("ativo",true).order("ordem").order("nome"),
    db.from("horarios_semana").select("*"),
    db.from("profissionais").select("*").eq("ativo",true).order("ordem").order("nome")]);
  profs=pr.error?[]:(pr.data||[]);prof=profs.length===1?profs[0]:null;
  zap=(c.data&&c.data.whatsapp)||"";passo=(c.data&&c.data.passo)||30;
  svcs=s.error?SERVICOS:s.data.map(x=>({nome:x.nome,preco:Number(x.preco),dur:x.dur}));
  (w.data||[]).forEach(r=>semana[r.dia]=r);
  drawProfs();drawDias();
  $("svcs").innerHTML=svcs.length?svcs.map((s,i)=>`<button class="svc" aria-pressed="false" data-i="${i}"><span class="n">${s.nome}</span><span class="d">${s.dur} min</span><b>${brl(s.preco)}</b></button>`).join(""):"Nenhum serviço disponível.";
  carregar();
}
$("svcs").onclick=e=>{const b=e.target.closest(".svc");if(!b)return;const i=+b.dataset.i;
  sel.has(i)?sel.delete(i):sel.add(i);b.setAttribute("aria-pressed",sel.has(i));
  const l=[...sel].sort((a,b)=>a-b).map(k=>svcs[k]);
  svc=l.length?{nome:l.map(s=>s.nome).join(" + "),preco:l.reduce((t,s)=>t+s.preco,0),dur:l.reduce((t,s)=>t+s.dur,0)}:null;
  hora=null;render();};

async function carregar(){
  const dia=$("dia").value;
  const [o,b]=await Promise.all([db.rpc("horarios_ocupados",{dia,prof:prof?prof.id:null}),db.from("bloqueios").select("inicio,fim").eq("data",dia)]);
  ocupados=o.error?[]:o.data.map(x=>[toMin(x.hora),toMin(x.hora)+x.duracao_min]);
  bloq=b.error?[]:b.data;
  hora=null;render();
  if(o.error)$("info").textContent="Não foi possível carregar os horários.";}

function render(){
  const d=new Date($("dia").value+"T00:00");$("info").textContent="";
  if(!svc){$("slots").innerHTML="";$("info").textContent="Escolha pelo menos um serviço para ver os horários.";return upd();}
  if(profs.length>1&&!prof){$("slots").innerHTML="";$("info").textContent="Escolha o profissional para ver os horários.";return upd();}
  const w=semana[d.getDay()]||{aberto:!CONFIG.DIAS_FECHADOS.includes(d.getDay()),abre:CONFIG.ABRE,fecha:CONFIG.FECHA};
  if(!w.aberto||bloq.some(x=>x.inicio==null)){$("slots").innerHTML="";$("info").textContent="Fechado neste dia. Escolha outra data.";return upd();}
  const bl=bloq.map(x=>[toMin(x.inicio),toMin(x.fim)]);
  const agora=new Date(),ehHoje=$("dia").value===hoje,nowM=agora.getHours()*60+agora.getMinutes();
  let h="";
  for(let m=toMin(w.abre);m+svc.dur<=toMin(w.fecha);m+=passo){
    const off=(ehHoje&&m<=nowM)||ocupados.some(([a,b])=>m<b&&a<m+svc.dur)||bl.some(([a,b])=>m<b&&a<m+svc.dur);
    h+=`<button class="slot" aria-pressed="${hora===toHM(m)}" data-h="${toHM(m)}" ${off?"disabled":""}>${toHM(m)}</button>`;}
  $("slots").innerHTML=h;
  if(!h)$("info").textContent="Sem horários para este serviço neste dia.";
  upd();}

$("slots").onclick=e=>{const b=e.target.closest(".slot");if(!b||b.disabled)return;hora=b.dataset.h;render();};
function upd(){
  const r=$("resumo");r.hidden=!svc;
  if(svc)r.textContent=`${svc.nome} · ${brl(svc.preco)} · ${svc.dur} min`+(prof&&profs.length>1?" · "+prof.nome:"")+(hora?` · ${$("dia").value.split("-").reverse().join("/")} às ${hora}`:"");
  $("ok").disabled=!(svc&&hora&&$("nome").value.trim().length>1&&$("tel").value.replace(/\D/g,"").length>=10);}
["nome","tel"].forEach(i=>$(i).oninput=upd);$("dia").onchange=carregar;

$("ok").onclick=async()=>{
  $("ok").disabled=true;$("msg").className="msg";$("msg").textContent="Enviando...";
  const {error}=await db.from("agendamentos").insert({nome:$("nome").value.trim(),telefone:$("tel").value.trim(),
    servico:svc.nome,preco:svc.preco,data:$("dia").value,hora,duracao_min:svc.dur,profissional_id:prof?prof.id:null});
  if(error){$("msg").className="msg bad";$("msg").textContent=error.message.includes("indispon")?"Esse horário acabou de ser ocupado. Escolha outro.":"Não foi possível agendar. Tente novamente.";await carregar();return;}
  const dataBR=$("dia").value.split("-").reverse().join("/");
  const texto=`Olá! Quero confirmar meu agendamento na Barbearia P.B:\n\n*Nome:* ${$("nome").value.trim()}\n*Serviço:* ${svc.nome}${prof&&profs.length>1?"\n*Profissional:* "+prof.nome:""}\n*Valor:* ${brl(svc.preco)}\n*Horário:* ${dataBR} às ${hora}\n\n_Lembrete: tolerância de 5 minutos de atraso._`;
  let n=((prof&&prof.whatsapp)||zap).replace(/\D/g,"");if(n&&n.length<=11)n="55"+n;
  $("msg").className="msg ok";
  if(!n){$("msg").textContent=`Agendado para ${dataBR} às ${hora}! (O WhatsApp do profissional ainda não foi cadastrado.)`;}
  else{const url=`https://wa.me/${n}?text=${encodeURIComponent(texto)}`;
    $("msg").innerHTML=`Agendado para ${dataBR} às ${hora}! Abrindo o WhatsApp...<a class="wa" href="${url}">Enviar para o WhatsApp</a>`;
    setTimeout(()=>{location.href=url;},800);}
  hora=null;await carregar();};
base();
</script></body></html>
